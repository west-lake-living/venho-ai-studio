  - phòng đôi view Hồ Tây
  - rooftop nhìn ra hồ, đón bình minh và hoàng hôn
  - sảnh nhỏ ấm cúng, góc đọc sách
  - nhận phòng 13:00, trả phòng 12:00 trưa

# GC2-P0-T02 — Danh mục Page đích. KHÔNG chứa secret (token/URL webhook nằm ở env, tham chiếu bằng tên).
# ID production do Harry cung cấp ngày 2026-11-04. Metadata Make được Claude xác minh chỉ đọc trên
# scenario production 5868920 ngày 2026-11-11; graph_api_version do Harry đọc từ Graph API Explorer
# cùng app. Make chỉ hiển thị tên đích; ánh xạ tên↔ID theo Graph /me/accounts ngày 2026-11-06.
# Xác nhận lại ánh xạ bằng post ID của lượt production đầu tiên.
# Không map bằng tên hiển thị: định danh đích là remote_page_id/remote_account_id.
version: 1
project: venho_hotel
timezone: Asia/Ho_Chi_Minh

channels:
  - channel_id: fb_hanoi
    environment: production
    platform: facebook
    display_name: Ven Hồ Hotel Hanoi (Tây Hồ)
    remote_page_id: "1124616474074140"       # module 3; xác nhận lại bằng post ID lượt production đầu
    make_scenario_id: "5868920"
    make_route_ref: GE_MAKE_WEBHOOK_URL_PAGE_A   # TÊN biến môi trường, không phải URL
    make_connection_ref: "Ven Ho Hotel Hanoi (Ha Pham)" # tên connection Make; không phải token
    graph_api_version: "v27.0" # Harry đọc từ Graph API Explorer cùng app
    service_principal: make-fb-hanoi
    scopes: [executions.authorize, receipts.write, media.read]
    meta_read_token_ref: GE_META_READ_TOKEN_PAGE_A   # TÊN biến môi trường
    caption_profile: default
    owner: Harry
    verified_on: "2026-11-11"
    enabled: false

  - channel_id: fb_venho
    environment: production
    platform: facebook
    display_name: Ven Hồ Hotel (Hanoi)
    remote_page_id: "803531149684177"
    make_scenario_id: "5868920"
    make_route_ref: GE_MAKE_WEBHOOK_URL_PAGE_B
    make_connection_ref: "Ven Ho Hotel Hanoi (Ha Pham)"
    graph_api_version: "v27.0" # Harry đọc từ Graph API Explorer cùng app
    service_principal: make-fb-venho
    scopes: [executions.authorize, receipts.write, media.read]
    meta_read_token_ref: GE_META_READ_TOKEN_PAGE_B
    caption_profile: default
    owner: Harry
    verified_on: "2026-11-11" # Make module 12; xác nhận lại bằng post ID lượt production đầu
    enabled: false

  - channel_id: ig_venho
    environment: production
    platform: instagram
    display_name: Ven Hồ Hotel Instagram
    remote_account_id: "17841457936965829"   # module 6; IG gắn Page Hanoi; xác nhận bằng post ID lượt đầu
    make_scenario_id: "5868920"
    make_route_ref: GE_MAKE_WEBHOOK_URL_IG_VENHO # tên biến môi trường, chưa cấu hình
    make_connection_ref: "Ven Ho Hotel Hanoi (Ha Pham)"
    graph_api_version: "v27.0" # Harry đọc từ Graph API Explorer cùng app
    service_principal: make-ig
    scopes: [executions.authorize, receipts.write, media.read]
    meta_read_token_ref: GE_META_READ_TOKEN_IG_VENHO
    caption_profile: default
    owner: Harry
    verified_on: "2026-11-11" # Make module 6; ID ánh xạ theo Graph /me/accounts 2026-11-06
    enabled: false

  # Page TEST riêng + scenario TEST riêng: mọi test có side effect chỉ chạy ở đây.
  # Graph API Page ID là 1363761820162798. URL profile.php?id=61596076389732 không phải Page ID Graph.
  - channel_id: page_test
    environment: test
    platform: facebook
    display_name: Ven Hồ Growth Test
    remote_page_id: "1363761820162798"
    make_scenario_id: "6924867"
    make_route_ref: GE_MAKE_WEBHOOK_URL_PAGE_TEST
    make_connection_ref: "Ven Ho Hotel Hanoi (Ha Pham)" # tên kết nối Make; ID số CHƯA XÁC MINH
    graph_api_version: "v27.0" # Harry đọc từ Graph API Explorer của Meta app đang dùng ngày 2026-11-10
    service_principals:
      fb_hanoi: make-fb-hanoi
      fb_venho: make-fb-venho
    scopes: [executions.authorize, receipts.write, media.read]
    meta_read_token_ref: GE_META_READ_TOKEN_PAGE_TEST
    caption_profile: default
    owner: Harry
    verified_on: "2026-11-10"
    enabled: false

  - channel_id: ig_test
    environment: test
    platform: instagram
    display_name: hanhpham1504
    # Instagram TEST account ID do Harry cung cấp; giữ dạng chuỗi, không dùng ID production.
    remote_account_id: "17841472240799413"
    make_scenario_id: "6924867"
    make_route_ref: GE_MAKE_WEBHOOK_URL_IG_TEST
    make_connection_ref: "Ven Ho Hotel Hanoi (Ha Pham)" # tên kết nối Make; ID số CHƯA XÁC MINH
    graph_api_version: "v27.0" # Harry đọc từ Graph API Explorer của Meta app đang dùng ngày 2026-11-10
    service_principal: make-ig
    scopes: [executions.authorize, receipts.write, media.read]
    meta_read_token_ref: GE_META_READ_TOKEN_IG_TEST
    caption_profile: default
    owner: Harry

version: 1

# One written question per research domain (plan v3.1 §6.7 guardrail:
# "mỗi chu kỳ nghiên cứu bắt đầu bằng đúng một câu hỏi viết ra. Không có câu
# hỏi → không chạy research"). run_research_cycle refuses to run a domain
# whose question is missing or blank -- that is the guardrail, in code.
#
# `collector: tavily` domains run automatically. `collector: manual` domains
# have no legal automated source (§7.2 forbids scraping FB/IG/TikTok, and OTA
# reviews are an explicit manual export), so a cycle for them ingests a file
# Harry supplies rather than inventing one.
#
# Write questions that have an ANSWER, not a discussion. The extractor is
# instructed to return nothing rather than fabricate, and it holds to that:
# "5–8 đối thủ định vị và định giá thế nào so với Ven Ho Hotel?" produced 0
# proposals from 16 real sources, because no page answers a comparative essay
# question. Narrowing it to "Giá phòng một đêm quanh Hồ Tây ở mức nào?"
# produced 4 sourced proposals from the same kind of pages (2026-08-06).

domains:
  competitor:
    question: "Giá phòng một đêm của các khách sạn quanh Hồ Tây hiện ở mức nào?"
    collector: tavily
    max_results: 8
    queries:
      - "giá phòng khách sạn Tây Hồ Hà Nội một đêm bao nhiêu"
      - "boutique hotel West Lake Hanoi room rate per night"
    # Deliberately no `urls:` -- the named rival listings live in
    # competitor_rating below, because an OTA page carries no price. Rates
    # here come from the search queries above, which do hit pages that quote
    # them.

  competitor_rating:
    question: "Các khách sạn cạnh tranh gần Ven Ho Hotel được khách chấm bao nhiêu điểm?"
    collector: manual
    # The 4 nearest rivals, named by Harry 2026-08-06. Canonical URLs: the
    # originals carried a checkIn=2026-07-28 already in the past plus per-visit
    # cid/ds/sid tokens.
    #
    # The working URL form differs per page and is not guessable -- Agoda's
    # `/vi-vn/` prefix works for some listings and fails for others, Booking
    # needs a language suffix that is `.vi.html` for one hotel and
    # `.en-us.html` for another. Each of these four was confirmed to extract
    # before being written down; do not "normalise" them.
    urls:
      # Lake View Hotel, 65 Trich Sai -- address confirmed in the page
      - "https://www.agoda.com/lake-view-hotel/hotel/hanoi-vn.html"
      # An Homestay Lakeview Apartment, 47 Trich Sai
      - "https://www.booking.com/hotel/vn/47-trich-sai-ha-noi-capital.en-us.html"
      - "https://www.agoda.com/vi-vn/the-urban-tranquil/hotel/hanoi-vn.html"
      - "https://www.agoda.com/vi-vn/4u-homestay/hotel/all/hanoi-vn.html"
    manual_source_hint: "Điền `urls:` (trang OTA của đối thủ) trong research_questions.yaml, hoặc chạy: venho-research cycle --domain competitor_rating --source-url <url>"

  local_intel:
    question: "Quanh Hồ Tây có những quán cà phê hay điểm đến nào đáng giới thiệu cho khách?"
    collector: tavily
    max_results: 8
    queries:
      - "quán cà phê view Hồ Tây đáng đi"
      - "địa điểm tham quan quanh Hồ Tây Hà Nội"

  local_events:
    question: "Sự kiện hoặc lễ hội nào sắp diễn ra ở Hà Nội, vào ngày nào?"
    collector: tavily
    max_results: 8
    # Default anyway; stated explicitly here because this is the domain it
    # exists for. The first real cycle proposed two festivals from 2024.
    reject_past_dates: true
    queries:
      - "lịch sự kiện Hà Nội sắp diễn ra ngày nào"
      - "lễ hội Tây Hồ Hà Nội thời gian tổ chức"

  social_trend:
    question: "Điểm đến hoặc trải nghiệm nào ở Hà Nội đang được nhắc đến nhiều tuần này?"
    collector: tavily
    max_results: 10
    queries:
      - "địa điểm Hà Nội đang hot tuần này"
      - "trending places Hanoi this week"

  market_pricing:
    question: "Tháng nào trong năm là cao điểm và thấp điểm du lịch của Hà Nội?"
    collector: tavily
    max_results: 8
    queries:
      - "mùa cao điểm thấp điểm du lịch Hà Nội tháng nào"
      - "best time to visit Hanoi peak season months"

  platform_trend:
    question: "Định dạng nội dung nào đang được Facebook và Instagram phân phối mạnh nhất?"
    collector: tavily
    max_results: 6
    queries:
      - "Instagram reels vs carousel reach 2026 data"
      - "Facebook page organic reach best format 2026"

  brand_visual:
    question: "Yếu tố hình ảnh nào khiến ảnh khách sạn boutique đạt tương tác cao?"
    collector: tavily
    max_results: 6
    queries:
      - "hotel photography engagement social media what works"

  guest_voice:
    question: "Khách thật sự khen và chê điều gì ở Ven Ho Hotel?"
    # Still `manual` as the fallback collector, but `urls:` below is filled in
    # now, so this domain runs automatically with the weekly sweep. It falls
    # back to waiting for an export only if every URL stops extracting.
    collector: manual
    # Ven Ho Hotel's own public review pages, read directly. Fill these in
    # and the domain runs automatically like the others; leave them empty and
    # it waits for an export file. Reading the hotel's own listing through a
    # documented API is not the scraping §7.2 forbids -- see
    # collectors/tavily_extract.py.
    #
    # Canonical listing URLs only -- Harry's links carried per-visit junk
    # (Agoda `asq=`/`ds=`, Booking `aid=`/`sid=`/`checkin=`) that would rot.
    # The stable parts are the hotel ids: agoda h37351491, booking
    # ven-ho-tay-ho. Booking needs the `.vi.html` variant; the bare `.html`
    # fails to fetch. TripAdvisor was not supplied by Harry -- it was found by
    # search and confirmed to be the right hotel by the 181 Nguyễn Đình Thi
    # address in the extracted page, so it is a third review corpus for free.
    urls:
      - "https://www.agoda.com/vi-vn/ven-ho-hotel-h37351491/hotel/hanoi-vn.html"
      - "https://www.booking.com/hotel/vn/ven-ho-tay-ho.vi.html"
      - "https://www.tripadvisor.com/Hotel_Review-g21301834-d26443777-Reviews-Ven_Ho_Hotel-Tay_Ho_Hanoi.html"
    manual_source_hint: "Điền `urls:` (trang review Agoda/Booking của Ven Ho Hotel) trong research_questions.yaml, hoặc chạy: venho-research cycle --domain guest_voice --source-url <url>, hoặc --input-file <file export>"

  weather_signal:
    question: "Thời tiết Hồ Tây 3 ngày tới tạo cơ hội hình ảnh gì?"
    collector: weather

# Maps scenario_registry.yaml's opaque reference_asset_ids to a folder under
# assets/raw/ so image_studio_runtime can load real bytes for GPTImageProvider's
# edit-with-reference call.
#
# Folder mode (2026-09-01): each id maps to a whole assets/raw/<subject>/
# folder, not one hardcoded filename. ReferenceAssetResolver pools every
# .jpg/.jpeg/.png under that folder (recursively, so sub-albums like
# room/ViewHo-room-1/ + ViewHo-room-2/ both count) and rotates through them
# by the run's slot_date. Harry's workflow going forward: drop a new photo
# straight into the matching assets/raw/<subject>/ folder -- no edit to this
# file needed, it is picked up on the next run automatically.
#
# NOT a curation/approval workflow -- pools are whatever's in the folder,
# nothing here has been through a QC/approval gate the way Linh An's
# B3/A2/C/D reference pack has (see projects/CLAUDE.md).
#
# Resolved 2026-09-07: the note that used to sit here ("a few older
# skyline-heavy shots can occasionally trip `no modern glass high-rise
# backdrop`") understated the problem by an order of magnitude. Five of the
# six photos in assets/raw/westlake/ contain that skyline -- it is simply
# what the far shore of West Lake looks like -- so the rotation hit a
# violating reference most days, the generated image inherited the towers,
# the validator's forbidden kill-switch capped it at 40 (regenerate) even
# with DNA-match 100/100, and the single retry reused the same reference
# and failed the same way. Result: 28 paid gpt-image-2 calls produced 6
# usable images and ~87% of posts shipped the static fallback photos.
# Harry's call was to fix the rule, not the pool: westlake/outside now
# forbid only a glass tower DOMINATING the frame, so a distant hazy
# skyline passes. See those subjects' .overrides.yaml notes.
assets:
  venho_rooftop_railing_approved: assets/raw/outside
  # Was pinned to data/projects/venho_hotel/media/lake_view_room_1/IMG_5584.jpeg
  # (a single photo outside assets/raw/ entirely) -- switched to the existing
  # assets/raw/room/ pool (16 photos across ViewHo-room-1/ and -2/) so this
  # id follows the same "drop a file in, it's picked up" convention as
  # every other subject.
  venho_room_lake_view_approved: assets/raw/room
  venho_lobby_approved: assets/raw/lobby
  venho_street_railing_approved: assets/raw/westlake
  venho_lake_landscape_approved: assets/raw/westlake

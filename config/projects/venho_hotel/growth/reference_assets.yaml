# usable raw photo found per subject at the time this file was written,
# 2026-08-04). Harry should review and swap paths for the actual best shot
# per scenario; nothing here has been through a QC/approval gate the way
# Linh An's B3/A2/C/D reference pack has (see projects/CLAUDE.md).
assets:

# Ven Hồ Hotel — Outdoor Spaces Overrides
# Covers: rooftop terrace, balconies, street-level exterior at 181 Nguyễn Đình Thi
# This file is curated by humans. Never overwrite via DNA regeneration.

forbidden:
  - "no infinity pool or resort-style pool deck — hotel has no pool"
  - "no rooftop bar with full commercial bar setup"
  - "no luxury resort terrace furniture (cabanas, daybeds)"
  - "no modern glass high-rise dominating the frame — a distant, hazy skyline across the water is real West Lake and is fine"
  - "no generic rooftop lounge aesthetic — this is a simple urban terrace"
  - "no manicured hotel garden — space is compact and urban"

allowed_imperfections:
  - "Hanoi haze over lake view acceptable and authentic"
  - "weathered tiles or concrete surface acceptable"
  - "visible neighboring rooftops acceptable"
  - "natural sky variation (clouds, smog) acceptable"
  - "modest outdoor furniture showing wear acceptable"

wording_overrides:
  lake_water_color: "jade-teal #4E8FA0 (Hồ Tây signature color)"
  space_context: "compact urban rooftop/terrace of a 5-floor boutique hotel on Nguyễn Đình Thi, Tây Hồ"

notes:
  - "2026-09-07: Harry's call — relaxed the old blanket 'no modern glass
    high-rise backdrop / no city high-rise skyline' rule. West Lake really
    does have a low/mid-rise skyline across the far shore; the blanket ban
    was the lobby's 'no marble floor' mistake again — a curated rule that
    contradicts the real place. It was tripping the validator kill-switch
    (forbidden=0.0 caps the score at 40 and forces regenerate) on images
    that otherwise scored DNA-match 100/100, and 5 of the 6 reference
    photos in assets/raw/westlake/ contain that same skyline, so the retry

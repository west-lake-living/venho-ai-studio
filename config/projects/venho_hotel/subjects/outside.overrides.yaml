    gpt-image-2 calls yielded only 6 usable images and ~87% of posts fell
    back to the 4 static hotel photos. What stays forbidden is a glass
    tower DOMINATING the frame (the generic Dubai/Shanghai look); a
    distant hazy skyline is now allowed."
  - "West Lake (Hồ Tây) should be visible or partially visible from upper floors"
  - "Street: Nguyễn Đình Thi — tree-lined, green lamp posts, low traffic"
  - "Outdoor spaces are modest — not resort, not bar venue, just genuine hotel terrace"

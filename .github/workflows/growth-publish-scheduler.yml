name: Growth Agent Publish Scheduler (manual fallback)

# Scheduled publishing moved to asus-server on 2026-10-21: systemd timers
# venho-growth-publish-{0900,1700}.timer run ~/venho/scripts/growth-dispatch.sh,
# because GitHub's best-effort `schedule` started 09:00 posts at 13:18-16:34
# ICT. Do NOT add a `schedule` back: two runners holding separate copies of
# the git-backed registry could both claim and send the same post.
# This workflow stays as a manual catch-up when the server is down.
on:
  workflow_dispatch:

permissions:
  contents: write

# Shares state with weekly generation; serialize commits to the Git-backed
# PublicationRegistry and growth.db.
concurrency:
  group: growth-publication-state
  cancel-in-progress: false

jobs:
  dispatch-due:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scheduler
        run: pip install -e .

      - name: Dispatch approved publications now due
        id: dispatch
        continue-on-error: true
        env:
          MAKE_GROWTH_WEBHOOK_URL: ${{ secrets.MAKE_GROWTH_WEBHOOK_URL }}
          MAKE_GROWTH_WEBHOOK_SECRET: ${{ secrets.MAKE_GROWTH_WEBHOOK_SECRET }}
          MAKE_ZALO_WEBHOOK_URL: ${{ secrets.MAKE_ZALO_WEBHOOK_URL }}
          MAKE_ZALO_WEBHOOK_SECRET: ${{ secrets.MAKE_ZALO_WEBHOOK_SECRET }}
          ZALO_APP_ID: ${{ secrets.ZALO_APP_ID }}
          ZALO_APP_SECRET: ${{ secrets.ZALO_APP_SECRET }}
          ZALO_REFRESH_TOKEN: ${{ secrets.ZALO_REFRESH_TOKEN }}
        run: |
          if [ -z "$MAKE_GROWTH_WEBHOOK_URL" ]; then
            echo "::error::MAKE_GROWTH_WEBHOOK_URL is not configured; refusing scheduled dispatch."
            exit 1
          fi
          args=(dispatch-due --allow-shadow --catch-up-today)
          venho-growth "${args[@]}"

      - name: Commit publication state
        if: always()
        run: |
          venho-growth slots --weeks-ahead 2 > data/projects/venho_hotel/growth/slots_snapshot.json
          git config user.name "venho-growth-bot"
          git config user.email "venho-growth-bot@users.noreply.github.com"
          git add -f data/projects/*/publishing/publication_registry.json 2>/dev/null || true
          git add -f data/projects/*/growth/growth.db 2>/dev/null || true
          git add -f data/projects/*/growth/slots_snapshot.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: growth scheduled dispatch $(date -u +%Y-%m-%dT%H%MZ)"
          git pull --rebase origin main
          git push

      - name: Fail when no due publication was dispatched
        if: steps.dispatch.outcome == 'failure'
        run: exit 1

name: Growth Agent Expire Stale Approvals

on:
  schedule:
    - cron: "15 0 * * *" # 07:15 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-publication-state
  cancel-in-progress: false

jobs:
  expire-stale-approvals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Retire overdue unreviewed drafts
        run: venho-growth expire-stale-approvals
      - name: Persist publication state
        run: |
          git config user.name "venho-growth-bot"
          git config user.email "venho-growth-bot@users.noreply.github.com"
          git add -f data/projects/*/publishing/publication_registry.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: expire stale growth approvals"
          git pull --rebase origin main
          git push

name: Growth Agent Replace Rejected Content

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      publication_id:
        description: "Rejected publication to replace immediately"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: growth-publication-state
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a rejected/stale publication to replace
        id: check
        # This cron fires every 15 min (GitHub throttles the *actual* rate
        # further, ~7/day observed) and virtually every run finds nothing --
        # replace_due_rejections only acts on REJECTED/STALE_APPROVAL rows,
        # which are rare. Before this check, every one of those no-op runs
        # still paid for `pip install -e ".[drive]"` (~18s, over half the
        # job's ~30s wall time) just to end up calling a CLI that does
        # nothing. `jq` ships on ubuntu-latest, so this reads the registry
        # JSON directly, in the ~1s checkout already costs, and skips setup
        # entirely when there is nothing to do (2026-09-08).
        run: |
          if [ -n "${{ inputs.publication_id }}" ]; then
            # An explicit manual target always runs -- replace_rejected_publication
            # itself still validates the row's status; skipping that here would
            # just duplicate the check the CLI already does correctly.
            echo "has_candidates=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          registry="data/projects/venho_hotel/publishing/publication_registry.json"
          if [ -f "$registry" ] && jq -e '
              .publications | any(
                .status as $s | ($s == "REJECTED" or $s == "STALE_APPROVAL")
                and (.replacement_publication_id == null or .replacement_publication_id == "")
              )' "$registry" > /dev/null; then
            echo "has_candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidates=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.has_candidates == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.check.outputs.has_candidates == 'true'
        run: pip install -e ".[drive]"
      - name: Generate replacement draft
        id: generate
        if: steps.check.outputs.has_candidates == 'true'
        continue-on-error: true
        env:
          # Image generation and image QC remain on OpenAI.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CONTENT_MODEL: ${{ vars.CLAUDE_CONTENT_MODEL }}
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          args=(replace-rejected)
          if [ -n "${{ inputs.publication_id }}" ]; then
            args+=(--publication-id "${{ inputs.publication_id }}")
          fi
          venho-growth "${args[@]}"
      - name: Persist replacement
        # Only when Generate replacement draft actually ran (success or
        # failure -- 'skipped' is neither) is there anything to commit.
        if: ${{ always() && steps.check.outputs.has_candidates == 'true' }}
        run: |
          git config user.name "venho-growth-bot"
          git config user.email "venho-growth-bot@users.noreply.github.com"
          git add -u data/projects
          git add -f data/projects/*/growth/rotation_state.json 2>/dev/null || true
          git add -f data/projects/*/growth/growth.db 2>/dev/null || true
          git add -f data/projects/*/publishing/publication_registry.json 2>/dev/null || true
          git add -f data/projects/*/content/**/*.json 2>/dev/null || true
          git add -f data/projects/*/content/**/*.md 2>/dev/null || true
          git add -f data/projects/*/prompts/**/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: replace rejected growth content"
          git pull --rebase origin main
          git push
      - name: Report replacement generation failure
        if: ${{ always() && steps.generate.outcome == 'failure' }}
        run: exit 1

name: Growth Agent Weekly Cycle

# Generates the whole week's cadence (Mon/Wed/Fri regular lane + Sat special
# lane) in one run, once a week, so Harry reviews and approves the full
# week's drafts together on VENHO OS Dashboard -- same "batch generate, one
# approval session" pattern the old VenHoSocialManager topic_schedule.json
# used, instead of one cadence day's draft trickling in per cron tick.
# Runs Monday 08:00 Asia/Ho_Chi_Minh (UTC+7) == 01:00 UTC Monday.
# This job only generates drafts and queues them PENDING_APPROVAL in
# PublicationRegistry -- it does NOT publish anything. Actual posting is
# triggered later by approving on VENHO OS Dashboard (see
# growth_orchestrator/application/approve_and_dispatch.py), which calls
# Make.com webhooks directly from wherever the dashboard backend runs, not
# from this workflow.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  weekly-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[drive]"

      - name: Run weekly cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Google Drive upload for generated images so Make.com's "HTTP: Get
          # a file" step has a real public URL to fetch -- see
          # shared/storage/google_drive.py. Reuses the same OAuth app/token
          # convention as the legacy venho-social-content-agent secret of the
          # same name; falls back to MockDriveUploader (image_public_url
          # stays null, post still queues text-only) if unset.
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: venho-growth weekly-cycle

      # data/ is gitignored (generated content, per-project knowledge/DNA
      # output) so rotation_state.json and publication_registry.json would
      # not persist across ephemeral runners without this -- same gotcha
      # documented for the legacy VenHoSocialManager workflow: `git add -f`
      # is required because .gitignore excludes data/ before pathspec
      # resolution.
      - name: Commit generated content and registry state
        run: |
          git config user.name "venho-growth-bot"
          git config user.email "venho-growth-bot@users.noreply.github.com"
          git add -f data/projects/*/growth/rotation_state.json \
                     data/projects/*/publishing/publication_registry.json \
                     data/projects/*/content/**/*.json \
                     data/projects/*/content/**/*.md \
                     data/projects/*/prompts/**/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: growth agent daily cycle $(date -u +%Y-%m-%d)"
          git push

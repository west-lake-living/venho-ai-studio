name: Growth Agent Weekly Cycle

# Generates eight cadence slots across two weeks (Mon/Wed/Fri regular lane +
# Sat special lane), so Harry reviews and approves the full two-week batch
# together on VENHO OS Dashboard -- same "batch generate, one
# approval session" pattern the old VenHoSocialManager topic_schedule.json
# used, instead of one cadence day's draft trickling in per cron tick.
# Attempts Sunday 20:00 and 22:00 Asia/Ho_Chi_Minh. GitHub Actions
# schedules are best-effort; retries recover a failed or delayed first attempt
# without needing an operator to generate the approval queue manually.
# This job only generates drafts and queues them PENDING_APPROVAL in
# PublicationRegistry -- it does NOT publish anything. Actual posting is
# dispatched later by the independent growth-publish-scheduler workflow.
on:
  schedule:
    - cron: "0 13 * * 0"
    - cron: "0 15 * * 0"
  workflow_dispatch:

# Without this the default GITHUB_TOKEN is read-only and the "Commit
# generated content" step below dies with `Permission to ... denied to
# github-actions[bot] (403)` -- after the run has already spent real API
# budget generating a week of drafts. The first real dispatch of the sister
# workflow (2026-08-06) failed exactly this way: the scan succeeded, and the
# results were discarded when the runner was torn down.
permissions:
  contents: write

# The scheduler persists publication state in the same files as this workflow.
# Never let the two workflows commit that state concurrently.
concurrency:
  group: growth-publication-state
  cancel-in-progress: false

jobs:
  weekly-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[drive]"

      - name: Run weekly cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Google Drive upload for generated images so Make.com's "HTTP: Get
          # a file" step has a real public URL to fetch -- see
          # shared/storage/google_drive.py. Reuses the same OAuth app/token
          # convention as the legacy venho-social-content-agent secret of the
          # same name; falls back to MockDriveUploader (image_public_url
          # stays null, post still queues text-only) if unset.
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Runway/budget/slot alerts are best-effort and fall back to a mock
          # notifier when unset, which is what happens today -- a cron run
          # that finds the queue empty currently tells nobody.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: venho-growth weekly-cycle --platform facebook --platform instagram

      # data/ is gitignored (generated content, per-project knowledge/DNA
      # output) so rotation_state.json and publication_registry.json would
      # not persist across ephemeral runners without this -- same gotcha
      # documented for the legacy VenHoSocialManager workflow: `git add -f`
      # is required because .gitignore excludes data/ before pathspec
      # resolution.
      #
      # growth.db carries the PublishingSlot table and the JobStore's weekly
      # idempotency row. Left out (as it was until 2026-08-06), every slot
      # this run filled died with the runner: the cadence table would stay
      # empty no matter how many weeks the cron ran, so DoD #9's "4 tuần
      # liên tục đủ 16 slot" could never accumulate any evidence, and the
      # per-week idempotency guard would not stop a re-trigger from
      # regenerating (and re-billing) the same week.
      - name: Commit generated content and registry state
        run: |
          venho-growth slots --weeks-ahead 2 > data/projects/venho_hotel/growth/slots_snapshot.json
          git config user.name "venho-growth-bot"
          git config user.email "venho-growth-bot@users.noreply.github.com"
          # Persist every tracked runtime store changed by the cycle. This
          # includes research/trend_candidates.json when a trend is consumed;
          # leaving it unstaged makes the later rebase refuse to start.
          git add -u data/projects
          # Keep optional path groups independent. A missing optional glob in
          # one large `git add` aborts that entire command and silently drops
          # growth.db/slots_snapshot along with it because of `|| true`.
          git add -f data/projects/*/growth/rotation_state.json 2>/dev/null || true
          git add -f data/projects/*/growth/growth.db 2>/dev/null || true
          git add -f data/projects/*/growth/slots_snapshot.json 2>/dev/null || true
          git add -f data/projects/*/growth/evergreen_pool.json 2>/dev/null || true
          git add -f data/projects/*/publishing/publication_registry.json 2>/dev/null || true
          git add -f data/projects/*/content/**/*.json 2>/dev/null || true
          git add -f data/projects/*/content/**/*.md 2>/dev/null || true
          git add -f data/projects/*/prompts/**/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: growth agent weekly cycle $(date -u +%Y-%m-%d)"
          # The weekly cycle modifies tracked registry/SQLite state as well as
          # creating untracked artifacts. Commit first, then rebase that
          # checkpoint onto any dashboard approval changes made while it ran.
          git pull --rebase origin main
          git push

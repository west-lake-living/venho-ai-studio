name: Growth Agent Trend Radar Scan (manual fallback)

# Google News RSS (+ official pages) -> Gemini Flash classification -> event
# clustering -> scan_trends scoring (research_engine/trend_radar).
#
# Scheduled scans moved to asus-server on 2026-10-21: systemd timer
# venho-growth-trend-scan.timer runs `growth-dispatch.sh trend-scan` twice a
# day (a weekly Friday scan found West Lake events after they had happened)
# and sends a Telegram alert for new events in the fast-lane window. This
# workflow stays for a manual run when the server is down.
#
# `human_approval: mandatory` (brand_safety.yaml) is enforced in code, not
# by this workflow: trend-scan only writes candidates with
# status="needs_human_approval"/"rejected" to trend_candidates.json --
# nothing here can make a candidate eligible for a post. Only an explicit
# `venho-growth trend-approve` (human action, via the dashboard or CLI) can.
on:
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only, so the commit step below 403'd on
# the first real dispatch (2026-08-06): Tavily and Gemini were called for
# real, 274 lines of candidates were produced, and every one of them was
# lost when the runner was torn down. The scheduled run would have done the
# same silently every Friday.
permissions:
  contents: write

jobs:
  trend-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[gemini]"

      - name: Run trend scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: venho-growth trend-scan

      # data/ is gitignored -- same gotcha as growth-daily-cycle.yml: `git
      # add -f` is required because .gitignore excludes data/ before
      # pathspec resolution, otherwise trend_candidates.json would not
      # persist across ephemeral runners.
      - name: Commit trend candidates
        run: |
          git config user.name "venho-growth-bot"
          git config user.email "venho-growth-bot@users.noreply.github.com"
          git add -f data/projects/*/research/trend_candidates.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: trend radar scan $(date -u +%Y-%m-%d)"
          git push

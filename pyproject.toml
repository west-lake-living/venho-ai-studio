[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venho-ai-studio"
version = "0.1.0"
description = "VENHO AI Studio — Knowledge-first AI production system for The West Lake Living"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.20",
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28"]
# Only needed for the real GoogleDriveUploader (shared/storage/google_drive.py)
# -- imports are deferred into __init__ so the 0-API-call test suite and
# MockDriveUploader default never require these installed.
drive = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.0", "google-auth>=2.23"]
# Only needed for the real GeminiClassifier (research_engine/trend_radar/classifiers/gemini_classifier.py)
# -- import is deferred into the function so the 0-API-call test suite never
# requires it installed (client_fn injection covers tests).
gemini = ["google-genai>=1.0"]

[project.scripts]
venho = "knowledge_studio.vision.cli:app"
venho-video = "video_studio.cli:app"
venho-publish = "publishing_gateway.cli:app"
venho-analytics = "analytics_feedback.cli:app"
venho-agent = "agent_studio.cli:app"
venho-research = "research_engine.cli:app"
venho-trend = "research_engine.trend_radar.cli:app"
venho-growth = "growth_orchestrator.cli:app"
venho-strategy = "strategy_memory.cli:app"
venho-rollout = "controlled_rollout.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_studio*", "analytics_feedback*", "app*", "automation_studio*", "content_studio*", "controlled_rollout*", "core*", "dashboard*", "growth_orchestrator*", "image_studio_runtime*", "knowledge_studio*", "productize*", "prompt_studio*", "providers*", "publishing_gateway*", "research_engine*", "shared*", "strategy_memory*", "validator_studio*", "video_studio*"]

[tool.setuptools.package-data]
"knowledge_studio.vision.prompts" = ["*.md"]
"validator_studio.prompts" = ["*.md"]
